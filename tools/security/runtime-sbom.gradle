// Resolve the actual release runtime graph, not a hand-maintained direct-dependency list.
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import groovy.json.JsonOutput
import java.security.MessageDigest

tasks.register('writeRuntimeInventory') {
    doLast {
        def components = [:]
        configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents.each { c ->
            if (c.id instanceof ModuleComponentIdentifier) {
                def id = c.id
                components["${id.group}:${id.module}:${id.version}".toString()] = [group:id.group, name:id.module, version:id.version, artifacts:[]]
            }
        }
        configurations.releaseRuntimeClasspath.incoming.artifacts.artifacts.each { a ->
            if (a.id.componentIdentifier instanceof ModuleComponentIdentifier) {
                def id=a.id.componentIdentifier
                def digest=MessageDigest.getInstance('SHA-256')
                a.file.withInputStream { input ->
                    byte[] buffer=new byte[65536]; int n
                    while ((n=input.read(buffer))!=-1) digest.update(buffer,0,n)
                }
                components["${id.group}:${id.module}:${id.version}".toString()].artifacts.add([file:a.file.name, sha256:digest.digest().encodeHex().toString()])
            }
        }
        def output=rootProject.file('.cache/supply-chain/java-runtime.json')
        output.parentFile.mkdirs()
        output.text=JsonOutput.prettyPrint(JsonOutput.toJson([scope:'releaseRuntimeClasspath; conservative pre-R8 resolved modules',components:components.values().sort{ "${it.group}:${it.name}:${it.version}" }]))+'\n'
        println "JAVA_RUNTIME_INVENTORY_OK modules=${components.size()}"
    }
}
