name: Build and publish signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: parvaz-stable-publication
  cancel-in-progress: false
jobs:
  candidate:
    uses: ./.github/workflows/validate-signing-release.yml
    secrets: inherit
  native:
    uses: ./.github/workflows/native-engines.yml
  archive:
    uses: ./.github/workflows/platform-update-probe.yml
  signed-release:
    needs: [candidate, native, archive]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Require immutable version-specific tag and release notes
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          version=re.search(r'versionName\s+"([^"]+)"',Path('app/build.gradle').read_text())[1]
          tag='v'+version
          if os.environ.get('GITHUB_REF_TYPE')!='tag' or os.environ.get('GITHUB_REF_NAME')!=tag:raise SystemExit('Publication requires matching version tag')
          if not Path('docs/releases/'+tag+'.md').is_file():raise SystemExit('Release notes missing')
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write('RELEASE_VERSION='+version+'\nRELEASE_TAG='+tag+'\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: signed-apks-for-upgrade-test, path: release-artifacts}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: sealed-signing-validation-candidate, path: .cache/core-candidate}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: supply-chain-review, path: .cache/supply-chain}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: actual-apk-upgrade-evidence, path: .cache/upgrade-validated}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: {distribution: temurin, java-version: '17'}
      - name: Use runner SDK without executing candidate code or accessing signing secrets
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;34.0.0'
      - name: Enforce exact tested APK bytes, source tree and dependency review
        run: |
          set -uo pipefail
          run_gate() {
            echo "== $*"
            if ! out=$("$@" 2>&1); then
              printf '::error title=PUBLISH_GATE_FAILED::%s%%0A%s\n' "$*" "$(printf '%s' "$out" | tail -c 2500 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
              printf '%s\n' "$out" | tail -60
              exit 1
            fi
            printf '%s\n' "$out" | tail -20
          }
          ls -R .cache/upgrade-validated | head -40
          run_gate python3 tools/release/core_candidate_artifacts.py verify "$RELEASE_VERSION"
          run_gate python3 tools/release/verify_publication_evidence.py
          run_gate python3 tools/release/verify_apk.py
          sha256sum release-artifacts/*-source.tar.gz release-artifacts/*-sbom.cdx.json release-artifacts/*-dependency-review.json release-artifacts/*-upgrade-verification.json | sed 's#release-artifacts/##' >> release-artifacts/SHA256SUMS.txt
      - name: Prevent rollback of latest app, versionCode or core
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -uo pipefail
          if ! out=$(python3 tools/release/check_release_order.py 2>&1); then
            printf '::error title=RELEASE_ORDER_FAILED::%s\n' "$(printf '%s' "$out" | tail -c 2500 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            printf '%s\n' "$out" | tail -40
            exit 1
          fi
          printf '%s\n' "$out" | tail -20
      - name: Publish only fully uploaded, tested release assets
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing release must never be overwritten'; exit 1
          fi
          gh release create "$RELEASE_TAG" release-artifacts/*.apk release-artifacts/*-source.tar.gz release-artifacts/*.json release-artifacts/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Parvaz $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_TAG.md" --draft
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
