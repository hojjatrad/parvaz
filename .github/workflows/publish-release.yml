name: Build and publish signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: parvaz-stable-publication
  cancel-in-progress: false
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require existing permanent signing secrets and consistent version
        env:
          PARVAZ_KEYSTORE_BASE64: ${{ secrets.PARVAZ_KEYSTORE_BASE64 }}
          PARVAZ_KEYSTORE_PASSWORD: ${{ secrets.PARVAZ_KEYSTORE_PASSWORD }}
          PARVAZ_KEY_ALIAS: ${{ secrets.PARVAZ_KEY_ALIAS }}
          PARVAZ_KEY_PASSWORD: ${{ secrets.PARVAZ_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release/build_signed.py --inputs-only
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'versionName\s+"([^"]+)"', Path('app/build.gradle').read_text()).group(1)
          tag = 'v' + version
          if os.environ.get('GITHUB_REF_TYPE') != 'tag' or os.environ.get('GITHUB_REF_NAME') != tag:
              raise SystemExit('Tag does not match app version; publication refused.')
          if not Path('docs/releases/' + tag + '.md').is_file():
              raise SystemExit('Version-specific release/migration notes are missing.')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('RELEASE_VERSION=' + version + '\nRELEASE_TAG=' + tag + '\n')
          PY
      - name: Test signing guards with synthetic data
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.7', cache: false}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::This version already has a release. Increment versionCode/versionName; do not overwrite old APKs.'
            exit 1
          fi
      - name: Run JVM regressions and prepare SDK/core
        run: |
          bash tools/audit/run.sh
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          bash tools/release/fetch_core.sh
      - name: Check release lint against reviewed legacy baseline
        run: ./gradlew --no-daemon --max-workers=2 :app:lintRelease
      - name: Run Android unit tests
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest
      - name: Build pinned engines, corresponding source and dependency notices
        run: |
          sdkmanager 'ndk;27.2.12479018'
          python3 tools/native/build.py
          python3 tools/native/source_bundle.py
      - name: Validate permanent key and build signed APKs with safe diagnostics
        env:
          PARVAZ_KEYSTORE_BASE64: ${{ secrets.PARVAZ_KEYSTORE_BASE64 }}
          PARVAZ_KEYSTORE_PASSWORD: ${{ secrets.PARVAZ_KEYSTORE_PASSWORD }}
          PARVAZ_KEY_ALIAS: ${{ secrets.PARVAZ_KEY_ALIAS }}
          PARVAZ_KEY_PASSWORD: ${{ secrets.PARVAZ_KEY_PASSWORD }}
        run: python3 tools/release/build_signed.py
      - name: Verify APK signatures, package, version and file hashes
        run: |
          python3 tools/release/verify_apk.py
          python3 tools/native/verify_packaging.py
      - name: Hash corresponding GPL source
        run: |
          sha256sum release-artifacts/*-source.tar.gz | sed 's#release-artifacts/##' >> release-artifacts/SHA256SUMS.txt
      - name: Prevent rollback of latest app, versionCode or core
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/check_release_order.py
      - name: Publish updater-visible release only after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-artifacts/*.apk release-artifacts/*-source.tar.gz release-artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Parvaz $RELEASE_VERSION" \
            --notes-file "docs/releases/$RELEASE_TAG.md" --latest
