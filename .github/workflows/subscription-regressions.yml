name: Subscription regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  jvm-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run JVM parser, storage and loopback HTTP tests (not an APK build)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          bash tools/audit/run.sh | tee test-results/subscription-tests.txt
          python3 tools/audit-repair/run_probe_policy.py | tee test-results/probe-policy.txt
      - name: Test release guards, security tooling, disposable-device boundary and safe cleanup
        run: |
          python3 -m unittest discover -s tools/release -p 'test_*.py'
          python3 -m unittest discover -s tools/security -p 'test_*.py'
          python3 -m unittest discover -s tools/upgrade-test -p 'test_*.py'
          python3 -m unittest discover -s tools/workspace -p 'test_*.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: subscription-test-results
          path: test-results/*.txt
          retention-days: 3
