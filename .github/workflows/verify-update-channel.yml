name: Verify published in-app update channel
on:
  push:
    branches: ['ci/verify-updater-v1.20']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the same latest endpoint used by installed applications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request
          url='https://api.github.com/repos/hojjatrad/parvaz/releases/latest'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'Parvaz-update-channel-verification'})
          with urllib.request.urlopen(request,timeout=30) as response: release=json.load(response)
          assert release['tag_name']=='v1.20' and not release['draft'] and not release['prerelease'], 'Unexpected updater release'
          assets={a['name']:a for a in release['assets']}
          assert set(assets)=={'Parvaz-1.20-arm64.apk','Parvaz-1.20.apk','SHA256SUMS.txt'}
          sums_url='https://github.com/hojjatrad/parvaz/releases/download/v1.20/SHA256SUMS.txt'
          with urllib.request.urlopen(sums_url,timeout=30) as response: text=response.read(4096).decode()
          sums={line.split()[1]:line.split()[0] for line in text.splitlines() if line.strip()}
          for name in ('Parvaz-1.20-arm64.apk','Parvaz-1.20.apk'):
              a=assets[name]
              assert a['browser_download_url']=='https://github.com/hojjatrad/parvaz/releases/download/v1.20/'+name
              assert 0<a['size']<=128*1024*1024
              assert re.fullmatch(r'sha256:[0-9a-f]{64}',a.get('digest',''))
              assert a['digest']=='sha256:'+sums[name]
          print('::notice title=UPDATE_CHANNEL_VERIFIED::The installed updater latest endpoint returns v1.20, not a draft/prerelease, with both expected APKs and matching SHA-256 metadata.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('Verified the installed updater endpoint: **v1.20**, normal latest release. Both APK URLs, sizes and API SHA-256 digests match the published checksum file. Android installation still requires user approval.\n')
          PY
