name: Actual Android package archive probe
on:
  push:
    branches: ['ci/platform-update-probe']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Fetch previously published signed APK as test data, never signing secrets
        run: |
          mkdir -p tools/android-probe/src/androidTest/assets
          curl -fL --max-time 120 https://github.com/hojjatrad/parvaz/releases/download/v1.21/Parvaz-1.21-arm64.apk -o tools/android-probe/src/androidTest/assets/published.apk
          echo '9c27f19a93a9a7ce09886eee62250a85811b9def119e55a8b4d289737aaaa40f  tools/android-probe/src/androidTest/assets/published.apk' | sha256sum -c
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: gradle -p tools/android-probe --no-daemon --max-workers=2 connectedDebugAndroidTest
      - name: Expose public APK parser results
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base=Path('tools/android-probe/build/outputs/androidTest-results')
          for file in base.rglob('logcat*.txt'):
              for line in file.read_text(errors='replace').splitlines():
                  if 'I ParvazProbe:' in line:print('::notice title=ANDROID_ARCHIVE_PROBE::'+line)
          for file in base.rglob('*.xml'):
              root=ET.parse(file).getroot()
              for item in root.iter('system-out'):
                  for line in (item.text or '').splitlines():
                      if 'ARCHIVE ' in line:print('::notice title=ANDROID_ARCHIVE_PROBE::'+line)
              for item in root.iter('failure'):print('::error title=ANDROID_ARCHIVE_PROBE::'+item.get('message','Assertion failed'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-probe-${{ matrix.api }}
          path: tools/android-probe/build/outputs/androidTest-results/
          retention-days: 3
