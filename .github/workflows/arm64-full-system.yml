name: Stock full-system ARM64 Android boot probe — no APK publication
on:
  push:
    branches: ['ci/arm64-full-system']
    paths: ['.github/workflows/arm64-full-system.yml']
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      QT_QPA_PLATFORM: xcb
      ANDROID_AVD_HOME: ${{ github.workspace }}/.cache/parvaz-arm64-avd
    steps:
      - name: Install official ARM64 system image and host renderer dependencies
        run: |
          mkdir -p evidence
          exec > >(tee evidence/preparation.log) 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then python3 -c "import pathlib; print(\"::error title=ARM64_PREPARATION::\"+pathlib.Path(\"evidence/preparation.log\").read_text(errors=\"replace\")[-3500:].replace(\"%\",\"%25\").replace(\"\\n\",\"%0A\"))"; fi' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libnss3 libx11-6 libxcb1 libgl1 libasound2t64 xvfb xauth libxcb-cursor0
          (set +o pipefail; yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'platform-tools' 'system-images;android-30;google_apis;arm64-v8a')
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n parvaz_arm64 -k 'system-images;android-30;google_apis;arm64-v8a' --device pixel_2 --force
          echo 'hw.ramSize=4096' >> "$ANDROID_AVD_HOME/parvaz_arm64.avd/config.ini"
          echo 'hw.cpu.ncore=4' >> "$ANDROID_AVD_HOME/parvaz_arm64.avd/config.ini"
      - name: Start the actual bundled ARM64 backend with a real AVD and software acceleration
        run: |
          mkdir -p evidence
          exec > >(tee evidence/boot-setup.log) 2>&1
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export LD_LIBRARY_PATH="$ANDROID_HOME/emulator/lib64:$ANDROID_HOME/emulator/lib64/qt/lib:${LD_LIBRARY_PATH:-}"
          QEMU="$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-aarch64"
          if [ -x "${QEMU}-headless" ]; then QEMU="${QEMU}-headless"; fi
          ulimit -c 0 # no host memory dump collection
          echo "Selected official backend: $QEMU"
          cp "$ANDROID_HOME/system-images/android-30/google_apis/arm64-v8a/source.properties" evidence/image.properties
          sha256sum "$QEMU" > evidence/emulator-backend.sha256
          adb start-server
          # Upstream selects virt on AArch64 hosts, but ranchu on x86 hosts.
          # API30 audio requires PCI; no-audio only mutes the backend, not HDA.
          # Select the official ARM64 virt machine explicitly; no image/APK modification.
          setsid xvfb-run -a -s "-screen 0 1280x1024x24" "$QEMU" -avd parvaz_arm64 -port 5554 -show-kernel -no-window -no-metrics -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -accel off -qemu -machine type=virt >evidence/emulator.log 2>&1 &
          export QEMU_PID=$!
          trap 'kill -- "-$QEMU_PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import os,pathlib,subprocess,time,json
          def adb(*args):
              try:return subprocess.run(['adb','-s','emulator-5554',*args],capture_output=True,text=True,timeout=10).stdout.strip()
              except subprocess.TimeoutExpired:return ''
          deadline=time.monotonic()+3600;booted=False
          while time.monotonic()<deadline:
              try:os.kill(int(os.environ['QEMU_PID']),0)
              except ProcessLookupError:break
              if adb('shell','getprop','sys.boot_completed')=='1':booted=True;break
              if int(time.monotonic())%60<6:
                  print('progress',int(time.monotonic()),{k:adb('shell','getprop',k) for k in ['init.svc.bootanim','dev.bootcomplete','init.svc.zygote','ro.boot.hardware']},flush=True)
              time.sleep(5)
          devices=subprocess.run(['adb','devices','-l'],capture_output=True,text=True,timeout=15)
          pathlib.Path('evidence/adb-devices.txt').write_text(devices.stdout+devices.stderr)
          partial=subprocess.run(['adb','-s','emulator-5554','shell','getprop'],capture_output=True,text=True,timeout=15)
          pathlib.Path('evidence/partial-getprop.txt').write_text(partial.stdout+partial.stderr)
          kernel=pathlib.Path('evidence/emulator.log').read_text(errors='replace')
          hits=[line for line in kernel.splitlines() if any(k in line.lower() for k in ['panic','failed to mount','first_stage','waiting for','fatal','error:','booting linux','command line:'])]
          print('::notice title=ARM64_KERNEL_DIAGNOSTIC::'+('\n'.join(hits[-25:])+'\nADB: '+devices.stdout+partial.stderr)[-6500:].replace('%','%25').replace('\n','%0A'))
          summary={'scope':'Boot capability only; no APK installation or release approval','booted':booted,'architecture':adb('shell','uname','-m') if booted else None,'selinux':adb('shell','getenforce') if booted else None,'native_bridge':adb('shell','getprop','ro.dalvik.vm.native.bridge') if booted else None}
          pathlib.Path('evidence/summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('::notice title=FULL_ARM64_BOOT::'+json.dumps(summary))
          if booted:pathlib.Path('evidence/getprop.txt').write_text(adb('shell','getprop'))
          else:
              text=pathlib.Path('evidence/emulator.log').read_text(errors='replace')[-3500:]
              print('::error title=FULL_ARM64_BOOT_LOG::'+text.replace('%','%25').replace('\n','%0A'))
          if not booted or summary['architecture']!='aarch64' or summary['selinux']!='Enforcing' or summary['native_bridge'] not in ('','0'):raise SystemExit(2)
          PY
      - name: Print bounded diagnostics after log writers have closed
        if: failure()
        run: |
          python3 - <<'PYDIAG'
          import pathlib
          for p in pathlib.Path('evidence').glob('*.log'):
              print('::error title=ARM64_ENVIRONMENT::'+(p.name+'\n'+p.read_text(errors='replace')[-3200:]).replace('%','%25').replace('\n','%0A'))
          PYDIAG
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-arm64-boot-evidence
          path: evidence/
          retention-days: 7
