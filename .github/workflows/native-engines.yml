name: Native engines and loopback protocol validation
on:
  push:
    branches: ['ci/native-engines']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.7', cache: false}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9', cache-disabled: true}
      - name: Prepare native compiler and build pinned engines
        run: |
          bash tools/release/fetch_core.sh
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.2.12479018'
          python3 tools/native/build.py --probe
          python3 tools/native/build.py --host
      - name: Validate production configuration builder through real loopback protocols
        run: |
          bash tools/audit/run.sh
          python3 tools/native/protocol_smoke.py
      - name: Generate disposable loopback-only TLS fixtures
        run: |
          mkdir -p .cache/native-test-assets .cache/native-test-res/raw
          openssl req -x509 -newkey rsa:2048 -nodes -keyout .cache/native-test-assets/fixture-key.pem -out .cache/native-test-assets/fixture-cert.pem -days 1 -subj /CN=localhost -addext subjectAltName=DNS:localhost,IP:127.0.0.1 >/dev/null 2>&1
          cp .cache/native-test-assets/fixture-cert.pem .cache/native-test-res/raw/native_fixture_ca.pem
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew -p tools/android-probe -PnativeProbe --no-daemon --max-workers=2 connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.parvaz.probe.NativeEngineTest
      - name: Preserve Android 10 native probe results
        run: cp -a tools/android-probe/build/outputs/androidTest-results .cache/native-results-29
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew -p tools/android-probe -PnativeProbe --no-daemon --max-workers=2 connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.parvaz.probe.NativeEngineTest
      - name: Expose native probe results
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          roots=[Path('tools/android-probe/build/outputs/androidTest-results'),Path('.cache/native-results-29')]
          successes={}
          for root in roots:
              for file in root.rglob('logcat*.txt'):
                  for line in file.read_text(errors='replace').splitlines():
                      if 'I ParvazProbe:' not in line:continue
                      message=line.split('I ParvazProbe:',1)[1].strip()
                      sdk=re.search(r'SDK=(\d+)',message)
                      if sdk:successes.setdefault(sdk[1],set()).add(message)
          # One notice per SDK avoids GitHub's per-step annotation count limit.
          for sdk,messages in sorted(successes.items()):
              print('::notice title=NATIVE_ANDROID_SDK_'+sdk+'::'+'; '.join(sorted(messages)).replace('%','%25'))
          for root in roots:
              for file in root.rglob('*.xml'):
                  suite=ET.parse(file).getroot()
                  if suite.tag=='testsuite':
                      print('::notice title=NATIVE_TEST_TOTALS::'+root.name+' '+file.name+' '+str({key:suite.get(key) for key in ['tests','failures','errors','skipped']}))
                  for item in suite.iter('failure'):print('::error title=NATIVE_ANDROID_PROBE::'+(item.get('message') or item.text or 'Assertion failed')[:1800].replace('%','%25').replace('\n','%0A'))
          PY
