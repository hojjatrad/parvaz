name: Native engines and loopback protocol validation
on:
  push:
    branches: ['ci/native-engines']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.7', cache: false}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9', cache-disabled: true}
      - name: Prepare native compiler and build pinned engines
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.2.12479018'
          python3 tools/native/build.py --probe
          python3 tools/native/build.py --host
      - name: Validate production configuration builder through real loopback protocols
        run: |
          bash tools/audit/run.sh
          python3 tools/native/protocol_smoke.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew -p tools/android-probe -PnativeProbe --no-daemon --max-workers=2 connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.parvaz.probe.NativeEngineTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew -p tools/android-probe -PnativeProbe --no-daemon --max-workers=2 connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.parvaz.probe.NativeEngineTest
      - name: Expose native probe results
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for file in Path('tools/android-probe/build/outputs/androidTest-results').rglob('logcat*.txt'):
              for line in file.read_text(errors='replace').splitlines():
                  if 'I ParvazProbe:' in line:print('::notice title=NATIVE_ANDROID_PROBE::'+line)
          for file in Path('tools/android-probe/build/outputs/androidTest-results').rglob('*.xml'):
              for item in ET.parse(file).getroot().iter('failure'):print('::error title=NATIVE_ANDROID_PROBE::'+item.get('message','Assertion failed'))
          PY
