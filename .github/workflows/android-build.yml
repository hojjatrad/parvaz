name: Android compilation and unit tests
on:
  push:
    branches: ['**']
    paths: ['app/**', 'tools/**', '*.gradle', 'gradle.properties', '.github/workflows/android-build.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK (avoid an unnecessary bootstrap download)
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Prepare Android SDK and pinned native core
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          bash tools/release/fetch_core.sh
      - name: Compile debug, run Android unit tests and check release R8 (no release secrets)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache
          if ! ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleDebug :app:minifyReleaseWithR8 >.cache/android-build.log 2>&1; then
            tail -100 .cache/android-build.log
            python3 - <<'PY'
          from pathlib import Path
          text = Path('.cache/android-build.log').read_text(errors='replace')[-5000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Android build diagnostics::' + text)
          PY
            exit 1
          fi
          tail -40 .cache/android-build.log
      - name: Summarize public fixture test results
        if: always()
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          totals={k:0 for k in ['tests','failures','errors','skipped']}; selected={}
          for path in sorted(Path('app/build/test-results').rglob('TEST-*.xml')):
              root=ET.parse(path).getroot()
              counts={k:int(root.get(k,'0')) for k in totals}
              for k in totals:totals[k]+=counts[k]
              for case in root.findall('testcase'):
                  for failure in list(case.findall('failure'))+list(case.findall('error')):
                      text=(case.get('classname','')+'.'+case.get('name','')+'\n'+(failure.text or ''))[:2800]
                      print('::error title=Public regression fixture::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
              if any(x in root.get('name','') for x in ['Restore','BackupPreservation','V115Regression','StartupWarmup','ReadinessMonitor','ReadinessConfig','TrafficSampling','NetworkMonitorRegression','ResumableDownload','BoundedProbeRace','HealthPolicy','ProbeOwnershipRegression','StartupDiagnostics','SerialConnectionQueue','DnsReconnectPolicyRegression','ReconnectOwnership','ResolverIdentity','ManualLatency','LatencyResult','StartupLatencyDisplay','HttpsLatency','LastConnected','AuditRepair']):selected[root.get('name','')]=counts
              if root.get('name','').endswith('V115RegressionTest'):
                  for output in root.iter('system-out'):
                      for line in (output.text or '').splitlines():
                          if line.startswith('V115_STALE_STORE_NAMESPACE='):print('::notice title=FIXTURE_ISOLATION::'+line)
          print('::notice title=UNIT_TEST_TOTALS::'+str(totals)+' selected='+str(selected))
          PYTEST
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            .cache/android-build.log
          include-hidden-files: true
          retention-days: 3
