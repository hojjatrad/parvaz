name: Inspect synthetic upgrade failure UI
on:
  push:
    branches: ['ci/upgrade-inspect-ui']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: 'actual-apk-upgrade-evidence-*'
          path: fixture-evidence
          run-id: 36313938999
          github-token: ${{ github.token }}
      - name: Expose only disposable-fixture UI and bounded crash traces
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          def note(title,text):print('::notice title='+title+'::'+text[:3500].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          note('FIXTURE_FILES','\n'.join(str(p) for p in pathlib.Path('fixture-evidence').rglob('*') if p.is_file()))
          for path in pathlib.Path('fixture-evidence').rglob('*.xml'):
              if 'final-ui' not in path.name:continue
              rows=[]
              for n in ET.parse(path).getroot().iter('node'):
                  if n.get('text') or n.get('content-desc'):rows.append(str({k:n.get(k) for k in ['package','resource-id','text','content-desc']}))
              note('FIXTURE_UI',str(path)+'\n'+'\n'.join(rows))
          for path in pathlib.Path('fixture-evidence').rglob('device.log'):
              lines=path.read_text(errors='replace').splitlines()
              for i,line in enumerate(lines):
                  if any(x in line for x in ['FATAL EXCEPTION','Process: com.parvaz.tunnel','Permission Denial','Error type 3','Force finishing activity com.parvaz']):note('FIXTURE_CRASH','\n'.join(lines[i:i+15]))
              note('DEVICE_LOG_TAIL','\n'.join(lines[-25:]))
          for path in pathlib.Path('fixture-evidence').rglob('fixture-run.log'):
              note('FIXTURE_RUN_HEAD',path.read_text(errors='replace')[:3200])
          PY
