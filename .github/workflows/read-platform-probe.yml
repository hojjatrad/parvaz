name: Read public platform probe results
on:
  push:
    branches: ['ci/platform-probe-status']
permissions:
  actions: read
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Summarize probe progress and public-APK-only test output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u <<'PY'
          import urllib.request,urllib.error,os,json,time
          base='https://api.github.com/repos/hojjatrad/parvaz'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'Parvaz-probe-results'}
          def api(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=30) as r:return json.load(r)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          import io,zipfile,xml.etree.ElementTree as ET
          artifacts=api('/actions/runs/34327073956/artifacts')['artifacts']
          for artifact in artifacts:
              request=urllib.request.Request(artifact['archive_download_url'],headers=headers)
              try:
                  with urllib.request.build_opener(NoRedirect).open(request,timeout=30) as r:blob=r.read(1024*1024)
              except urllib.error.HTTPError as e:
                  if e.code!=302:raise
                  with urllib.request.urlopen(e.headers['Location'],timeout=30) as r:blob=r.read(1024*1024)
              with zipfile.ZipFile(io.BytesIO(blob)) as z:
                  for name in z.namelist():
                      print('::notice title=PROBE_FILE::'+artifact['name']+' '+name)
                      data=z.read(name)
                      if 'logcat' in name.lower():
                          lines=data.decode(errors='replace').splitlines()
                          for line in lines:
                              if 'ParvazProbe' in line or 'Failure to parse' in line or 'PackageParserException' in line:
                                  print('::notice title=PARSE_REASON::'+line[:1200])
                      if not name.endswith('.xml'):continue
                      root=ET.fromstring(z.read(name))
                      for child in root.iter():
                          if not child.tag.endswith('failure'):continue
                          print('::notice title=PROBE_ASSERTION::'+artifact['name']+' '+(child.text or '')[:1600].replace('\n',' | ').replace('\r',''))
          PY
