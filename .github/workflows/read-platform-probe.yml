name: Read Android validation failures
on:
  push:
    branches: ['ci/platform-probe-status']
permissions:
  actions: read
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read test diagnostics only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import urllib.request,os,json
          base='https://api.github.com/repos/hojjatrad/parvaz'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'Parvaz-test-status'}
          def fetch(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=30) as r:return r.read()
          for run in [34331530822,34331816056]:
              for job in json.loads(fetch('/actions/runs/'+str(run)+'/jobs'))['jobs']:
                  print('::notice title=TEST_STATUS::'+str(run)+' '+str(job['conclusion']))
                  if job['status']=='completed' and job['conclusion']=='failure':
                      lines=fetch('/actions/jobs/'+str(job['id'])+'/logs').decode().splitlines()
                      relevant=[line for line in lines if any(word in line for word in ['error:',' FAILED','What went wrong','Execution failed','AssertionError','tests completed','Compilation failed'])]
                      for line in relevant[-20:]:print('::notice title=TEST_FAILURE::'+line.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
