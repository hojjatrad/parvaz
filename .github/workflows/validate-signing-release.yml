name: Validate permanent signing and release APKs without publication
on:
  workflow_call:
  push:
    branches: ['release/signing-validation-v3', 'release/final-1288', 'release/final-1289']
concurrency:
  group: parvaz-candidate-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Reclaim unused runner toolchains before large native builds
        run: |
          df -h .
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h .
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test signing guards with synthetic data
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'
      - name: Test staged transport boundaries with dummy bytes
        run: python3 -m unittest discover -s tools/upgrade-test -p 'test_*.py'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version: '1.27.1', cache: false}  # exactly the reviewed Xray provenance toolchain
      - name: Use runner Android SDK
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Run host regressions and prepare SDK/core
        run: |
          bash tools/audit/run.sh
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          bash tools/release/fetch_core.sh
      - name: Check both ordinary fail-closed and explicit unsigned build guards before native builds
        run: |
          if env -u PARVAZ_UNSIGNED_CANDIDATE ./gradlew --no-daemon :app:requireReleaseSigning > .cache/expected-signing-denial.log 2>&1; then
            echo 'Ordinary uncredentialed packaging must fail'; exit 1
          fi
          grep -q 'Release signing secrets are missing' .cache/expected-signing-denial.log
          PARVAZ_UNSIGNED_CANDIDATE=true ./gradlew --no-daemon :app:requireReleaseSigning
      - name: Check lint against reviewed legacy baseline
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --max-workers=2 :app:lintDebug :app:lintRelease > .cache/lint-repair.log 2>&1
          result=$?
          tail -60 .cache/lint-repair.log
          python3 - <<'PYLINT'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in Path('app/build/reports').glob('lint-results-*.xml'):
              for issue in ET.parse(report).getroot().findall('issue'):
                  if issue.get('severity') not in ('Error','Fatal'):continue
                  loc=issue.find('location')
                  text=issue.get('id','')+': '+issue.get('message','')+'; '+(str(loc.attrib) if loc is not None else '')
                  print('::error title=Lint repair diagnostics::'+text.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PYLINT
          exit "$result"
      - name: Run Android unit tests
        run: |
          if ! ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest > .cache/android-unit.log 2>&1; then
            tail -120 .cache/android-unit.log
            python3 - <<'PY'
          from pathlib import Path
          lines=Path('.cache/android-unit.log').read_text(errors='replace').splitlines()
          for line in [x for x in lines if any(k in x for k in ['error:',' FAILED','AssertionError','tests completed'])][-12:]:
              print('::notice title=ANDROID_TEST_FAILURE::'+line.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
            exit 1
          fi
          cat .cache/android-unit.log
      - name: Build pinned engines and prepare corresponding source after fast checks
        run: |
          sdkmanager 'ndk;27.2.12479018' 'ndk;29.0.14206865'
          python3 tools/native/build.py
          python3 tools/native/xray_candidate.py build
          python3 tools/native/source_bundle.py --candidate-xray
      - name: Inventory and audit resolved Java and native Go dependencies
        run: |
          ./gradlew --no-daemon --max-workers=2 :app:writeRuntimeInventory
          python3 tools/security/dependency_audit.py --native --candidate-xray
      - name: Preserve supply-chain review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-review
          path: .cache/supply-chain/
          include-hidden-files: true
          retention-days: 5
      - name: Build and seal unsigned APKs for the isolated-signing path
        env:
          PARVAZ_UNSIGNED_CANDIDATE: 'true'
        run: bash tools/release/unsigned_candidate.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sealed-signing-validation-candidate
          path: .cache/core-candidate/
          include-hidden-files: true
          retention-days: 1
  sign-prebuilt:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sealed-signing-validation-candidate
          path: .cache/core-candidate
      - name: Check sealed artifacts against this exact source tree
        run: |
          VERSION=$(python3 -c 'import re;print(re.search(r"versionName\s+\"([^\"]+)\"",open("app/build.gradle").read())[1])')
          python3 tools/release/core_candidate_artifacts.py verify "$VERSION"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: {distribution: temurin, java-version: '17'}
      - name: Use runner Android SDK
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - run: sdkmanager 'build-tools;34.0.0'
      - name: Sign prebuilt APKs with the verified existing permanent key
        env:
          PARVAZ_KEYSTORE_BASE64: ${{ secrets.PARVAZ_KEYSTORE_BASE64 }}
          PARVAZ_KEYSTORE_PASSWORD: ${{ secrets.PARVAZ_KEYSTORE_PASSWORD }}
          PARVAZ_KEY_ALIAS: ${{ secrets.PARVAZ_KEY_ALIAS }}
          PARVAZ_KEY_PASSWORD: ${{ secrets.PARVAZ_KEY_PASSWORD }}
        run: python3 tools/release/sign_prebuilt.py
      - name: Verify APK signature, package, version and hashes without publishing
        run: |
          python3 tools/release/verify_apk.py
      - name: Preserve signed candidate APKs for isolated installation validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-apks-for-upgrade-test
          path: release-artifacts/*.apk
          retention-days: 3
  probe-apks:
    # The Android SDK build tools have no linux-arm64 binaries, so the probe and
    # its instrumentation APK are built here and only installed on the arm64 job.
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: {gradle-version: '8.9', cache-disabled: true}
      - run: chmod +x gradlew && ./gradlew -p tools/android-probe -PupgradeProbe --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Collect probe APKs
        run: |
          set -eux
          mkdir -p probe-apks
          cp "$(find tools/android-probe/build/outputs/apk/debug -name '*.apk' | head -1)" probe-apks/probe.apk
          cp "$(find tools/android-probe/build/outputs/apk/androidTest -name '*.apk' | head -1)" probe-apks/probe-test.apk
          sha256sum probe-apks/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: upgrade-probe-apks, path: probe-apks/, retention-days: 5}
  install-upgrade:
    # The published APKs contain only armeabi-v7a/arm64-v8a. On x86_64 runners the
    # signed release cannot execute honestly (priors 39/41/42 abort under ARM
    # translation), and GitHub's arm64 runners expose no /dev/kvm, so the QEMU
    # emulator is unusable there. The fixture therefore runs the unmodified signed
    # arm64 APKs natively in a disposable Android 11 (API 30) arm64 container.
    # Prior = the immutable, owner-installed published TEST 42 build: a real signed
    # published APK, not a rebuilt fixture.
    needs: [sign-prebuilt, probe-apks]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: signed-apks-for-upgrade-test, path: release-artifacts}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: upgrade-probe-apks, path: probe-apks}
      - name: Boot a disposable native arm64 Android 11 container
        run: |
          set -eux
          sudo apt-get update -qq || true
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          if [ ! -e /dev/binder ]; then
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || true
            sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          fi
          if [ ! -e /dev/binder ] && [ ! -e /dev/binderfs/binder-control ]; then
            sudo mkdir -p /dev/binderfs
            sudo mount -t binder binder /dev/binderfs || true
          fi
          test -e /dev/binder -o -e /dev/binderfs/binder-control
          docker pull -q redroid/redroid:11.0.0-latest
          mkdir -p "$HOME/redroid-data"
          docker run -itd --privileged --security-opt apparmor=unconfined --name redroid -p 5555:5555 \
            -v "$HOME/redroid-data":/data redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=1080 androidboot.redroid_height=1920 androidboot.redroid_dpi=320 \
            androidboot.redroid_gpu_mode=guest
          sudo apt-get install -y -qq adb
          for i in $(seq 1 60); do
            [ "$(docker exec redroid /system/bin/getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 10
          done
          adb start-server; sleep 2
          docker exec redroid /system/bin/mkdir -p /data/misc/adb
          docker exec -i redroid /system/bin/sh -c 'cat > /data/misc/adb/adb_keys' < "$HOME/.android/adbkey.pub"
          docker exec redroid /system/bin/chmod 640 /data/misc/adb/adb_keys
          docker exec redroid /system/bin/setprop ctl.restart adbd
          sleep 5
          CIP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' redroid)
          GW=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}' redroid)
          BOOTED=0
          for i in $(seq 1 48); do
            adb connect "$CIP:5555" || true
            if [ "$(adb -s "$CIP:5555" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] \
               && [ -n "$(adb -s "$CIP:5555" shell getprop ro.product.cpu.abilist 2>/dev/null | tr -d '\r')" ]; then
              BOOTED=1; break
            fi
            sleep 10
          done
          adb devices -l
          # Never run the fixture against a half-booted container: that produces an
          # unreadable failure instead of installation evidence.
          if [ "$BOOTED" != "1" ]; then
            echo '::error title=ARM64_DEVICE_NOT_READY::redroid did not report sys.boot_completed with a populated ABI list'
            docker logs --tail 80 redroid || true
            exit 1
          fi
          echo "ANDROID_SERIAL=$CIP:5555" >> "$GITHUB_ENV"
          echo "PARVAZ_HOST_IP=$GW" >> "$GITHUB_ENV"
          echo "::notice title=ARM64_DEVICE::serial=$CIP:5555 sdk=$(adb -s "$CIP:5555" shell getprop ro.build.version.sdk | tr -d '\r') abis=$(adb -s "$CIP:5555" shell getprop ro.product.cpu.abilist | tr -d '\r')"
      - name: Actual signed-APK upgrade fixture
        env:
          PARVAZ_CONTAINER: redroid
          PARVAZ_UPGRADE_PRIOR: stable47
        run: |
          set -o pipefail
          mkdir -p .cache
          bash tools/upgrade-test/run_container.sh 2>&1 | tee .cache/fixture.log
      - name: Report installation fixture outcome
        if: always()
        run: |
          python3 - <<'PYUPGRADE'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base=Path('tools/android-probe/build/outputs/androidTest-results')
          if base.exists():
              for p in base.rglob('*.xml'):
                  root=ET.parse(p).getroot()
                  for f in list(root.iter('failure'))+list(root.iter('error')):
                      message=(f.get('message') or f.text or 'Upgrade fixture failed')[:2800]
                      print('::error title=APK upgrade fixture::'+message.replace('%','%25').replace('\n','%0A'))
          p=Path('.cache/upgrade-evidence/device.log')
          if p.exists():
              for line in p.read_text(errors='replace').splitlines():
                  if 'ACTUAL_SIGNED_APK_UPDATE_BUTTON_OK' in line:print('::notice title=APK_UPGRADE_EVIDENCE::'+line)
          s=Path('.cache/upgrade-evidence/summary.json')
          if s.exists():print('::notice title=UPGRADE_SUMMARY::'+s.read_text()[:900].replace('%','%25').replace('\n','%0A'))
          PYUPGRADE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: actual-apk-upgrade-evidence
          path: |
            .cache/upgrade-evidence/
            tools/android-probe/build/outputs/androidTest-results/
          include-hidden-files: true
          retention-days: 5
  public-review-evidence:
    needs: [validate, install-upgrade]
    if: always() && (github.ref == 'refs/heads/release/signing-validation-v3' || github.ref == 'refs/heads/release/final-1288')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with: {name: actual-apk-upgrade-evidence, path: .cache/public-review/upgrade}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with: {name: supply-chain-review, path: .cache/public-review/supply-chain}
      - name: Publish synthetic screenshots and public dependency review, never APKs or keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/upgrade-test/publish_evidence.py
