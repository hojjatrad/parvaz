# Synthetic interoperability fixtures: no live subscriptions/credentials.
proxies:
  - {name: 'Inline SS, demo', type: ss, server: ss.example.invalid, port: 443, cipher: aes-128-gcm, password: yes}
  - name: Reality گره آزمایشی
    type: vless
    server: reality.example.invalid
    port: 443
    uuid: 11111111-1111-4111-8111-111111111111
    tls: true
    network: grpc
    servername: cover.example.invalid
    client-fingerprint: chrome
    alpn: [h2, http/1.1]
    flow: ''
    reality-opts:
      public-key: dummy-public-key
      short-id: 00123456
    grpc-opts: {grpc-service-name: 'demo/service'}
  - name: WS آزمایش
    type: vmess
    server: ws.example.invalid
    port: 8443
    uuid: 22222222-2222-4222-8222-222222222222
    alterId: 0
    tls: true
    skip-cert-verify: false
    network: ws
    ws-opts:
      path: '/test?a=1&b=2'
      headers: {Host: edge.example.invalid}
  - name: WireGuard IPv6
    type: wireguard
    server: '2001:db8::1'
    port: 51820
    private-key: dummy-private-key
    public-key: dummy-peer-key
    pre-shared-key: dummy-preshared-key
    ip: 10.7.0.2
    ipv6: 'fd00::2'
    reserved: [1, 2, 255]
    mtu: 1280
proxy-groups:
  - {name: choose, type: select, proxies: ['Inline SS, demo']}
rules: ['MATCH,choose']
