apply plugin: 'com.android.application'

// Inject from a secret manager/CI environment. Never put signing credentials in Git.
def signingValues = ['PARVAZ_KEYSTORE_PATH', 'PARVAZ_KEYSTORE_PASSWORD',
                     'PARVAZ_KEY_ALIAS', 'PARVAZ_KEY_PASSWORD'].collect { System.getenv(it) }
def releaseSigningReady = signingValues.every { it != null && !it.isEmpty() }


android {
    namespace 'com.parvaz.tunnel'
    compileSdk 34

    defaultConfig {
        applicationId "com.parvaz.tunnel"
        minSdk 24
        targetSdk 34
        versionCode 22
        versionName "1.21"
        resValue "string", "bundled_core_version", new groovy.json.JsonSlurper().parse(rootProject.file('tools/release/core-lock.json')).tag
        vectorDrawables.useSupportLibrary = true

        // libv2ray.aar also ships x86/x86_64 builds of libgojni. No Iranian Android
        // phone needs them and they add ~70 MB to the universal APK.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs/jni']
        }
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(signingValues[0])
                storePassword signingValues[1]
                keyAlias signingValues[2]
                keyPassword signingValues[3]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }

    packagingOptions {
        jniLibs {
            // false stores libgojni uncompressed and adds ~45 MB. Always true.
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/*.kotlin_module', 'DebugProbesKt.bin',
                         'META-INF/versions/9/previous-compilation-data.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '2000'
    options.compilerArgs << '-nowarn'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation files('libs/libv2ray.aar')
    implementation 'org.yaml:snakeyaml:2.4' // SafeConstructor + explicit resource limits

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.json:json:20240303'
}

// Dump the compile classpath so `jc.sh` can run a 3-second javac probe
// instead of a 60-second Gradle round trip.
tasks.register('dumpCp') {
    doLast {
        def cp = android.applicationVariants.find { it.name == 'release' }
                .javaCompileProvider.get().classpath.files.collect { it.absolutePath }
        new File('/opt/pb/cp.txt').text = cp.join(':')
        new File('/opt/pb/boot.txt').text =
                android.bootClasspath.collect { it.absolutePath }.join(':')
        println "cp entries: ${cp.size()}"
    }
}

// Debug/test builds need no release keys. Release packaging must fail closed.
def requireReleaseSigning = tasks.register('requireReleaseSigning') {
    doLast {
        if (!releaseSigningReady) {
            throw new GradleException('Release signing secrets are missing. See docs/BUILD-SECURITY.md')
        }
    }
}
tasks.configureEach {
    if (name.toLowerCase(java.util.Locale.ROOT).contains('release') &&
            (name.startsWith('package') || name.startsWith('sign') || name.startsWith('assemble') ||
             name.startsWith('bundle') || name.startsWith('validateSigning'))) {
        dependsOn(requireReleaseSigning)
    }
}
